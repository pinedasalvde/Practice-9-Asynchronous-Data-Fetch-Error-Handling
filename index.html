<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
</head>
<body>
  <h1>User Directory</h1>
  <button id="reload" type="button">Reload users</button>
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="users"></ul>

  <script>
    const usersList = document.getElementById("users");
    const status = document.getElementById("status");
    const reloadButton = document.getElementById("reload");

    async function loadUsers() {
      reloadButton.disabled = true;
      status.textContent = "Loading users...";
      usersList.replaceChildren();

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/users"
        );

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        const users = await response.json();

        if (
          !Array.isArray(users) ||
          users.length === 0 ||
          !users.every(user =>
            user &&
            typeof user.name === "string" &&
            user.name.trim() &&
            typeof user.email === "string" &&
            user.email.trim()
          )
        ) {
          throw new Error("Invalid user data");
        }

        users.forEach(user => {
          const item = document.createElement("li");
          item.textContent = `${user.name} — ${user.email}`;
          usersList.appendChild(item);
        });

        status.textContent = `Showing ${users.length} users.`;
      } catch (error) {
        console.error("Could not load users:", error);
        status.textContent = "Sorry, we couldn't load users. Please try again.";
      } finally {
        reloadButton.disabled = false;
      }
    }

    reloadButton.addEventListener("click", loadUsers);
    loadUsers();
  </script>
</body>
</html>
