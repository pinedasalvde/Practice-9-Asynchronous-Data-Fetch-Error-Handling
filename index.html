<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public API Users</title>
</head>
<body>
  <main>
    <h1>Users</h1>
    <p id="status" role="status">Loading users...</p>
    <ul id="users"></ul>
    <button id="retry" type="button" hidden>Try again</button>
  </main>

  <script>
    const status = document.getElementById('status');
    const users = document.getElementById('users');
    const retry = document.getElementById('retry');

    async function loadUsers() {
      status.textContent = 'Loading users...';
      users.replaceChildren();
      retry.hidden = true;

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!response.ok) {
          throw new Error('Request failed');
        }

        const data = await response.json();
        for (const user of data) {
          const item = document.createElement('li');
          item.textContent = user.name;
          users.appendChild(item);
        }
        status.textContent = data.length ? 'Users loaded.' : 'No users found.';
      } catch (error) {
        status.textContent = 'Could not load users. Please try again.';
        retry.hidden = false;
      }
    }

    retry.addEventListener('click', loadUsers);
    loadUsers();
  </script>
</body>
</html>
